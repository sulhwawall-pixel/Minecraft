AWSTemplateFormatVersion: '2010-09-09'
Description: >
  마인크래프트 서버 시작 버튼. 폰에서 링크를 누르면 EC2 인스턴스가 켜집니다.
  IAM 역할, Lambda 함수, 공개 함수 URL을 한 번에 만듭니다.

Parameters:
  InstanceId:
    Type: String
    Description: 켤 EC2 인스턴스 ID (예 i-0abc123def456)
    AllowedPattern: '^i-[0-9a-f]{8,17}$'
    ConstraintDescription: i- 로 시작하는 인스턴스 ID여야 합니다.

  Secret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      링크에 ?key= 로 붙일 암호. 최소 16자.
      터미널에서 openssl rand -hex 16 으로 만드세요.

  Hostname:
    Type: String
    Default: ''
    Description: (선택) 안내 화면에 표시할 접속 주소. 예 my-sunlit.duckdns.org

Resources:

  # 이 인스턴스 하나만 켤 수 있는 최소 권한. 링크가 유출돼도 다른 건 못 건드린다.
  StarterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-minecraft
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              # DescribeInstances 는 리소스 단위 제한을 지원하지 않아 * 여야 한다.
              # 읽기 전용이라 위험하지 않다.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'

  StarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: 마인크래프트 서버 EC2 인스턴스를 시작합니다
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.lambda_handler
      Role: !GetAtt StarterRole.Arn
      Timeout: 30
      Environment:
        Variables:
          INSTANCE_ID: !Ref InstanceId
          SECRET: !Ref Secret
          HOSTNAME: !Ref Hostname
      Code:
        ZipFile: |
          import os, boto3
          ec2 = boto3.client("ec2")
          IID = os.environ["INSTANCE_ID"]
          SECRET = os.environ["SECRET"]
          HOST = os.environ.get("HOSTNAME", "")

          def page(title, msg, code=200):
              addr = f"<p class=a>{HOST}</p>" if HOST else ""
              return {"statusCode": code,
                      "headers": {"Content-Type": "text/html; charset=utf-8"},
                      "body": f"""<!doctype html><meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>마인크래프트 서버</title><style>
          body{{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
          max-width:30rem;margin:3rem auto;padding:0 1.5rem;line-height:1.7;
          background:#12151a;color:#e6e6e6}}h1{{font-size:1.4rem}}
          .a{{background:#1e2530;padding:.8rem 1rem;border-radius:.5rem;
          font-family:ui-monospace,monospace;font-size:1.1rem}}
          .m{{color:#9aa4b2;font-size:.95rem}}</style>
          <h1>{title}</h1><p>{msg}</p>{addr}
          <p class=m>모드가 많아 접속까지 3~5분 걸립니다.</p>"""}

          def lambda_handler(event, context):
              q = event.get("queryStringParameters") or {}
              if q.get("key") != SECRET:
                  return page("접근할 수 없습니다", "링크가 올바르지 않습니다.", 403)
              r = ec2.describe_instances(InstanceIds=[IID])
              state = r["Reservations"][0]["Instances"][0]["State"]["Name"]
              if state == "running":
                  return page("이미 켜져 있습니다", "바로 접속하시면 됩니다.")
              if state in ("pending", "stopping"):
                  return page("처리 중입니다", f"현재 상태: {state}. 잠시 후 다시 확인해 주세요.")
              if state != "stopped":
                  return page("지금은 켤 수 없습니다", f"현재 상태: {state}", 409)
              ec2.start_instances(InstanceIds=[IID])
              return page("서버를 켰습니다", "곧 접속할 수 있습니다.")

  StarterUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt StarterFunction.Arn
      AuthType: NONE

  # 함수 URL 을 인증 없이 열려면 이 권한이 따로 있어야 한다.
  # 실제 접근 통제는 Lambda 코드 안의 SECRET 검사가 담당한다.
  StarterUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt StarterFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  BaseUrl:
    Description: 함수 URL. 뒤에 ?key=입력한암호 를 붙인 것이 최종 링크입니다.
    Value: !GetAtt StarterUrl.FunctionUrl

  HowToUse:
    Description: 폰 홈 화면에 추가해서 쓰세요.
    Value: !Sub '${StarterUrl.FunctionUrl}?key=<스택 생성 때 입력한 Secret>'
