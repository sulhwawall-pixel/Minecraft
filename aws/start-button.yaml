AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Minecraft server start button. Opening the link from a phone starts the EC2
  instance. Creates the IAM role, Lambda function and public function URL.

Parameters:
  InstanceId:
    Type: String
    Description: EC2 instance ID to start, e.g. i-0abc123def456
    AllowedPattern: '^i-[0-9a-f]{8,17}$'
    ConstraintDescription: Must be an instance ID starting with i-

  Secret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      Password appended to the link as ?key=. At least 16 characters.
      Generate one with: openssl rand -hex 16

  Hostname:
    Type: String
    Default: ''
    Description: Optional. Address shown on the status page, e.g. my-sunlit.duckdns.org

Resources:

  # Least privilege: can start only this one instance. A leaked link cannot touch anything else.
  StarterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-minecraft
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              # DescribeInstances does not support resource-level restriction, so it must be *.
              # It is read-only.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'

  StarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Starts the Minecraft server EC2 instance
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.lambda_handler
      Role: !GetAtt StarterRole.Arn
      Timeout: 30
      Environment:
        Variables:
          INSTANCE_ID: !Ref InstanceId
          SECRET: !Ref Secret
          HOSTNAME: !Ref Hostname
      Code:
        ZipFile: |
          import os, boto3
          ec2 = boto3.client("ec2")
          IID = os.environ["INSTANCE_ID"]
          SECRET = os.environ["SECRET"]
          HOST = os.environ.get("HOSTNAME", "")

          def page(title, msg, code=200):
              addr = f"<p class=a>{HOST}</p>" if HOST else ""
              return {"statusCode": code,
                      "headers": {"Content-Type": "text/html; charset=utf-8"},
                      "body": f"""<!doctype html><meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>\ub9c8\uc778\ud06c\ub798\ud504\ud2b8 \uc11c\ubc84</title><style>
          body{{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
          max-width:30rem;margin:3rem auto;padding:0 1.5rem;line-height:1.7;
          background:#12151a;color:#e6e6e6}}h1{{font-size:1.4rem}}
          .a{{background:#1e2530;padding:.8rem 1rem;border-radius:.5rem;
          font-family:ui-monospace,monospace;font-size:1.1rem}}
          .m{{color:#9aa4b2;font-size:.95rem}}</style>
          <h1>{title}</h1><p>{msg}</p>{addr}
          <p class=m>\ubaa8\ub4dc\uac00 \ub9ce\uc544 \uc811\uc18d\uae4c\uc9c0 3~5\ubd84 \uac78\ub9bd\ub2c8\ub2e4.</p>"""}

          def lambda_handler(event, context):
              q = event.get("queryStringParameters") or {}
              if q.get("key") != SECRET:
                  return page("\uc811\uadfc\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4", "\ub9c1\ud06c\uac00 \uc62c\ubc14\ub974\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", 403)
              r = ec2.describe_instances(InstanceIds=[IID])
              state = r["Reservations"][0]["Instances"][0]["State"]["Name"]
              if state == "running":
                  return page("\uc774\ubbf8 \ucf1c\uc838 \uc788\uc2b5\ub2c8\ub2e4", "\ubc14\ub85c \uc811\uc18d\ud558\uc2dc\uba74 \ub429\ub2c8\ub2e4.")
              if state in ("pending", "stopping"):
                  return page("\ucc98\ub9ac \uc911\uc785\ub2c8\ub2e4", f"\ud604\uc7ac \uc0c1\ud0dc: {state}. \uc7a0\uc2dc \ud6c4 \ub2e4\uc2dc \ud655\uc778\ud574 \uc8fc\uc138\uc694.")
              if state != "stopped":
                  return page("\uc9c0\uae08\uc740 \ucf24 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4", f"\ud604\uc7ac \uc0c1\ud0dc: {state}", 409)
              ec2.start_instances(InstanceIds=[IID])
              return page("\uc11c\ubc84\ub97c \ucf30\uc2b5\ub2c8\ub2e4", "\uace7 \uc811\uc18d\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.")

  StarterUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt StarterFunction.Arn
      AuthType: NONE

  # Required to expose the function URL without auth.
  # Access control is the SECRET check inside the Lambda code.
  StarterUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt StarterFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  BaseUrl:
    Description: Function URL. Append ?key=YOUR_SECRET to get the final link.
    Value: !GetAtt StarterUrl.FunctionUrl

  HowToUse:
    Description: Add this to your phone home screen.
    Value: !Sub '${StarterUrl.FunctionUrl}?key=YOUR_SECRET'
