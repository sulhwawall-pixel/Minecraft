# Society: Sunlit Valley — OCI Ampere A1 (2 OCPU / 12GB) 기준 설정
# 서버 팩에 server.properties 가 이미 있으면 설치 스크립트가 아래 값들만 덮어씁니다.

# ── 성능 (2코어 ARM에서 가장 큰 영향을 주는 항목들) ──────────────────
# 시야거리를 줄이는 것이 저사양 서버에서 체감 효과가 제일 큽니다.
view-distance=8
simulation-distance=6
max-players=6
network-compression-threshold=512
# ARM + 블록 스토리지 환경에서 동기 쓰기는 틱을 크게 잡아먹습니다.
sync-chunk-writes=false
max-tick-time=120000

# ── 게임 플레이 ──────────────────────────────────────────────────
motd=Sunlit Valley - OCI
gamemode=survival
difficulty=normal
hardcore=false
pvp=true
spawn-protection=0
allow-flight=true
max-world-size=29999984

# ── 접속 ────────────────────────────────────────────────────────
server-port=25565
# 정품 인증. 반드시 true 로 두세요. false 는 아무나 아무 닉네임으로 들어옵니다.
online-mode=true
# 처음엔 false 로 두고, 친구들 접속 확인 후 true 로 바꾸는 걸 권합니다.
white-list=false
enforce-whitelist=false
enable-command-block=false

# ── 원격 관리 (기본 꺼둠) ─────────────────────────────────────────
enable-rcon=false
enable-query=false
